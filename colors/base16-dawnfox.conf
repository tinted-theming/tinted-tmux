# Base16 dawnfox
# Scheme author: EdenEast (https://github.com/EdenEast)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#575279,bg=#faf4ed"

# default window title colors
set-window-option -g window-status-style "fg=#575279,bg=#faf4ed"

# active window title colors
set-window-option -g window-status-current-style "fg=#ea9d34,bg=#faf4ed"

# pane border
set-option -g pane-border-style "fg=#ebe0df"
set-option -g pane-active-border-style "fg=#a8a3b3"

# message text
set-option -g message-style "fg=#625c87,bg=#ebe0df"

# pane number display
set-option -g display-panes-active-colour "#a8a3b3"
set-option -g display-panes-colour "#ebe0df"

# clock
set-window-option -g clock-mode-colour "#286983"

# copy mode highlight
set-window-option -g mode-style "fg=#a8a3b3,bg=#ebe0df"

# bell
set-window-option -g window-status-bell-style "fg=#faf4ed,bg=#b4637a"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#575279,bg=#faf4ed"

# style for command messages
set-option -g message-command-style "fg=#625c87,bg=#ebe0df"

# Optional active/inactive pane state
# BASE16_TMUX_OPTION_ACTIVE is a legacy variable
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ] || [ "$BASE16_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#575279,bg=#faf4ed"
  set-window-option -g window-style "fg=#575279,bg=#faf4ed"
}

# Optional statusbar
# BASE16_TMUX_OPTION_STATUSBAR is a legacy variable
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ] || [ "$BASE16_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#575279,bg=#ebdfe4] #S #[fg=#ebdfe4,bg=#faf4ed,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#ebe0df,bg=#faf4ed nobold, nounderscore, noitalics]#[fg=#a8a3b3,bg=#ebe0df] %Y-%m-%d  %H:%M #[fg=#575279,bg=#ebe0df,nobold,noitalics,nounderscore]#[fg=#faf4ed,bg=#575279] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#faf4ed,bg=#ea9d34,nobold,noitalics,nounderscore]#[fg=#ebe0df,bg=#ea9d34] #I #[fg=#ebe0df,bg=#ea9d34,bold] #W#{?window_zoomed_flag,*Z,} #[fg=#ea9d34,bg=#faf4ed,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#faf4ed,bg=#ebe0df,noitalics]#[fg=#625c87,bg=#ebe0df] #I #[fg=#625c87,bg=#ebe0df] #W#{?window_zoomed_flag,*Z,} #[fg=#ebe0df,bg=#faf4ed,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
