# Base16 dayfox
# Scheme author: EdenEast (https://github.com/EdenEast)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#3d2b5a,bg=#f6f2ee"

# default window title colors
set-window-option -g window-status-style "fg=#3d2b5a,bg=#f6f2ee"

# active window title colors
set-window-option -g window-status-current-style "fg=#ac5402,bg=#f6f2ee"

# pane border
set-option -g pane-border-style "fg=#dbd1dd"
set-option -g pane-active-border-style "fg=#824d5b"

# message text
set-option -g message-style "fg=#643f61,bg=#dbd1dd"

# pane number display
set-option -g display-panes-active-colour "#824d5b"
set-option -g display-panes-colour "#dbd1dd"

# clock
set-window-option -g clock-mode-colour "#2848a9"

# copy mode highlight
set-window-option -g mode-style "fg=#824d5b,bg=#dbd1dd"

# bell
set-window-option -g window-status-bell-style "fg=#f6f2ee,bg=#a5222f"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#3d2b5a,bg=#f6f2ee"

# style for command messages
set-option -g message-command-style "fg=#643f61,bg=#dbd1dd"

# Optional active/inactive pane state
# BASE16_TMUX_OPTION_ACTIVE is a legacy variable
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ] || [ "$BASE16_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#3d2b5a,bg=#f6f2ee"
  set-window-option -g window-style "fg=#3d2b5a,bg=#f6f2ee"
}

# Optional statusbar
# BASE16_TMUX_OPTION_STATUSBAR is a legacy variable
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ] || [ "$BASE16_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#3d2b5a,bg=#d3c7bb] #S #[fg=#d3c7bb,bg=#f6f2ee,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#dbd1dd,bg=#f6f2ee nobold, nounderscore, noitalics]#[fg=#824d5b,bg=#dbd1dd] %Y-%m-%d  %H:%M #[fg=#3d2b5a,bg=#dbd1dd,nobold,noitalics,nounderscore]#[fg=#f6f2ee,bg=#3d2b5a] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#f6f2ee,bg=#ac5402,nobold,noitalics,nounderscore]#[fg=#dbd1dd,bg=#ac5402] #I #[fg=#dbd1dd,bg=#ac5402,bold] #W#{?window_zoomed_flag,*Z,} #[fg=#ac5402,bg=#f6f2ee,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#f6f2ee,bg=#dbd1dd,noitalics]#[fg=#643f61,bg=#dbd1dd] #I #[fg=#643f61,bg=#dbd1dd] #W#{?window_zoomed_flag,*Z,} #[fg=#dbd1dd,bg=#f6f2ee,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
