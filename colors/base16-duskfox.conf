# Base16 duskfox
# Scheme author: EdenEast (https://github.com/EdenEast)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#e0def4,bg=#232136"

# default window title colors
set-window-option -g window-status-style "fg=#e0def4,bg=#232136"

# active window title colors
set-window-option -g window-status-current-style "fg=#f6c177,bg=#232136"

# pane border
set-option -g pane-border-style "fg=#2d2a45"
set-option -g pane-active-border-style "fg=#6e6a86"

# message text
set-option -g message-style "fg=#cdcbe0,bg=#2d2a45"

# pane number display
set-option -g display-panes-active-colour "#6e6a86"
set-option -g display-panes-colour "#2d2a45"

# clock
set-window-option -g clock-mode-colour "#569fba"

# copy mode highlight
set-window-option -g mode-style "fg=#6e6a86,bg=#2d2a45"

# bell
set-window-option -g window-status-bell-style "fg=#232136,bg=#eb6f92"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#e0def4,bg=#232136"

# style for command messages
set-option -g message-command-style "fg=#cdcbe0,bg=#2d2a45"

# Optional active/inactive pane state
# BASE16_TMUX_OPTION_ACTIVE is a legacy variable
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ] || [ "$BASE16_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#e0def4,bg=#232136"
  set-window-option -g window-style "fg=#e0def4,bg=#232136"
}

# Optional statusbar
# BASE16_TMUX_OPTION_STATUSBAR is a legacy variable
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ] || [ "$BASE16_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#e0def4,bg=#373354] #S #[fg=#373354,bg=#232136,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#2d2a45,bg=#232136 nobold, nounderscore, noitalics]#[fg=#6e6a86,bg=#2d2a45] %Y-%m-%d  %H:%M #[fg=#e0def4,bg=#2d2a45,nobold,noitalics,nounderscore]#[fg=#232136,bg=#e0def4] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#232136,bg=#f6c177,nobold,noitalics,nounderscore]#[fg=#2d2a45,bg=#f6c177] #I #[fg=#2d2a45,bg=#f6c177,bold] #W#{?window_zoomed_flag,*Z,} #[fg=#f6c177,bg=#232136,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#232136,bg=#2d2a45,noitalics]#[fg=#cdcbe0,bg=#2d2a45] #I #[fg=#cdcbe0,bg=#2d2a45] #W#{?window_zoomed_flag,*Z,} #[fg=#2d2a45,bg=#232136,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
