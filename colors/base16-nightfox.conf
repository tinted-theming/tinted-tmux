# Base16 nightfox
# Scheme author: EdenEast (https://github.com/EdenEast)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#cdcecf,bg=#192330"

# default window title colors
set-window-option -g window-status-style "fg=#cdcecf,bg=#192330"

# active window title colors
set-window-option -g window-status-current-style "fg=#dbc074,bg=#192330"

# pane border
set-option -g pane-border-style "fg=#212e3f"
set-option -g pane-active-border-style "fg=#71839b"

# message text
set-option -g message-style "fg=#aeafb0,bg=#212e3f"

# pane number display
set-option -g display-panes-active-colour "#71839b"
set-option -g display-panes-colour "#212e3f"

# clock
set-window-option -g clock-mode-colour "#719cd6"

# copy mode highlight
set-window-option -g mode-style "fg=#71839b,bg=#212e3f"

# bell
set-window-option -g window-status-bell-style "fg=#192330,bg=#c94f6d"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#cdcecf,bg=#192330"

# style for command messages
set-option -g message-command-style "fg=#aeafb0,bg=#212e3f"

# Optional active/inactive pane state
# BASE16_TMUX_OPTION_ACTIVE is a legacy variable
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ] || [ "$BASE16_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#cdcecf,bg=#192330"
  set-window-option -g window-style "fg=#cdcecf,bg=#192330"
}

# Optional statusbar
# BASE16_TMUX_OPTION_STATUSBAR is a legacy variable
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ] || [ "$BASE16_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#cdcecf,bg=#29394f] #S #[fg=#29394f,bg=#192330,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#212e3f,bg=#192330 nobold, nounderscore, noitalics]#[fg=#71839b,bg=#212e3f] %Y-%m-%d  %H:%M #[fg=#cdcecf,bg=#212e3f,nobold,noitalics,nounderscore]#[fg=#192330,bg=#cdcecf] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#192330,bg=#dbc074,nobold,noitalics,nounderscore]#[fg=#212e3f,bg=#dbc074] #I #[fg=#212e3f,bg=#dbc074,bold] #W#{?window_zoomed_flag,*Z,} #[fg=#dbc074,bg=#192330,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#192330,bg=#212e3f,noitalics]#[fg=#aeafb0,bg=#212e3f] #I #[fg=#aeafb0,bg=#212e3f] #W#{?window_zoomed_flag,*Z,} #[fg=#212e3f,bg=#192330,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
