# Base16 nordfox
# Scheme author: EdenEast (https://github.com/EdenEast)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#cdcecf,bg=#2e3440"

# default window title colors
set-window-option -g window-status-style "fg=#cdcecf,bg=#2e3440"

# active window title colors
set-window-option -g window-status-current-style "fg=#ebcb8b,bg=#2e3440"

# pane border
set-option -g pane-border-style "fg=#39404f"
set-option -g pane-active-border-style "fg=#7e8188"

# message text
set-option -g message-style "fg=#abb1bb,bg=#39404f"

# pane number display
set-option -g display-panes-active-colour "#7e8188"
set-option -g display-panes-colour "#39404f"

# clock
set-window-option -g clock-mode-colour "#81a1c1"

# copy mode highlight
set-window-option -g mode-style "fg=#7e8188,bg=#39404f"

# bell
set-window-option -g window-status-bell-style "fg=#2e3440,bg=#bf616a"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#cdcecf,bg=#2e3440"

# style for command messages
set-option -g message-command-style "fg=#abb1bb,bg=#39404f"

# Optional active/inactive pane state
# BASE16_TMUX_OPTION_ACTIVE is a legacy variable
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ] || [ "$BASE16_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#cdcecf,bg=#2e3440"
  set-window-option -g window-style "fg=#cdcecf,bg=#2e3440"
}

# Optional statusbar
# BASE16_TMUX_OPTION_STATUSBAR is a legacy variable
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ] || [ "$BASE16_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#cdcecf,bg=#444c5e] #S #[fg=#444c5e,bg=#2e3440,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#39404f,bg=#2e3440 nobold, nounderscore, noitalics]#[fg=#7e8188,bg=#39404f] %Y-%m-%d  %H:%M #[fg=#cdcecf,bg=#39404f,nobold,noitalics,nounderscore]#[fg=#2e3440,bg=#cdcecf] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#2e3440,bg=#ebcb8b,nobold,noitalics,nounderscore]#[fg=#39404f,bg=#ebcb8b] #I #[fg=#39404f,bg=#ebcb8b,bold] #W#{?window_zoomed_flag,*Z,} #[fg=#ebcb8b,bg=#2e3440,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#2e3440,bg=#39404f,noitalics]#[fg=#abb1bb,bg=#39404f] #I #[fg=#abb1bb,bg=#39404f] #W#{?window_zoomed_flag,*Z,} #[fg=#39404f,bg=#2e3440,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
