# Base16 Penumbra Dark Contrast Plus
# Scheme author: Neal McKee (https://github.com/nealmckee/penumbra)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#999999,bg=#1d2024"

# default window title colors
set-window-option -g window-status-style "fg=#999999,bg=#1d2024"

# active window title colors
set-window-option -g window-status-current-style "fg=#a39720,bg=#1d2024"

# pane border
set-option -g pane-border-style "fg=#292b30"
set-option -g pane-active-border-style "fg=#7f7f81"

# message text
set-option -g message-style "fg=#bab8b4,bg=#292b30"

# pane number display
set-option -g display-panes-active-colour "#7f7f81"
set-option -g display-panes-colour "#292b30"

# clock
set-window-option -g clock-mode-colour "#008fc6"

# copy mode highlight
set-window-option -g mode-style "fg=#7f7f81,bg=#292b30"

# bell
set-window-option -g window-status-bell-style "fg=#1d2024,bg=#cd6b76"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#999999,bg=#1d2024"

# style for command messages
set-option -g message-command-style "fg=#bab8b4,bg=#292b30"

# Optional active/inactive pane state
# BASE16_TMUX_OPTION_ACTIVE is a legacy variable
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ] || [ "$BASE16_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#999999,bg=#1d2024"
  set-window-option -g window-style "fg=#999999,bg=#1d2024"
}

# Optional statusbar
# BASE16_TMUX_OPTION_STATUSBAR is a legacy variable
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ] || [ "$BASE16_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#999999,bg=#404246] #S #[fg=#404246,bg=#1d2024,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#292b30,bg=#1d2024 nobold, nounderscore, noitalics]#[fg=#7f7f81,bg=#292b30] %Y-%m-%d  %H:%M #[fg=#999999,bg=#292b30,nobold,noitalics,nounderscore]#[fg=#1d2024,bg=#999999] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#1d2024,bg=#a39720,nobold,noitalics,nounderscore]#[fg=#292b30,bg=#a39720] #I #[fg=#292b30,bg=#a39720,bold] #W#{?window_zoomed_flag,*Z,} #[fg=#a39720,bg=#1d2024,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#1d2024,bg=#292b30,noitalics]#[fg=#bab8b4,bg=#292b30] #I #[fg=#bab8b4,bg=#292b30] #W#{?window_zoomed_flag,*Z,} #[fg=#292b30,bg=#1d2024,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
