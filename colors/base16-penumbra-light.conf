# Base16 Penumbra Light
# Scheme author: Neal McKee (https://github.com/nealmckee/penumbra)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#8b8b8b,bg=#efe8dd"

# default window title colors
set-window-option -g window-status-style "fg=#8b8b8b,bg=#efe8dd"

# active window title colors
set-window-option -g window-status-current-style "fg=#958a1c,bg=#efe8dd"

# pane border
set-option -g pane-border-style "fg=#dfd9d0"
set-option -g pane-active-border-style "fg=#a19f9d"

# message text
set-option -g message-style "fg=#5e6063,bg=#dfd9d0"

# pane number display
set-option -g display-panes-active-colour "#a19f9d"
set-option -g display-panes-colour "#dfd9d0"

# clock
set-window-option -g clock-mode-colour "#0082b5"

# copy mode highlight
set-window-option -g mode-style "fg=#a19f9d,bg=#dfd9d0"

# bell
set-window-option -g window-status-bell-style "fg=#efe8dd,bg=#bb626b"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#8b8b8b,bg=#efe8dd"

# style for command messages
set-option -g message-command-style "fg=#5e6063,bg=#dfd9d0"

# Optional active/inactive pane state
# BASE16_TMUX_OPTION_ACTIVE is a legacy variable
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ] || [ "$BASE16_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#8b8b8b,bg=#efe8dd"
  set-window-option -g window-style "fg=#8b8b8b,bg=#efe8dd"
}

# Optional statusbar
# BASE16_TMUX_OPTION_STATUSBAR is a legacy variable
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ] || [ "$BASE16_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#8b8b8b,bg=#d1ccc5] #S #[fg=#d1ccc5,bg=#efe8dd,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#dfd9d0,bg=#efe8dd nobold, nounderscore, noitalics]#[fg=#a19f9d,bg=#dfd9d0] %Y-%m-%d  %H:%M #[fg=#8b8b8b,bg=#dfd9d0,nobold,noitalics,nounderscore]#[fg=#efe8dd,bg=#8b8b8b] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#efe8dd,bg=#958a1c,nobold,noitalics,nounderscore]#[fg=#dfd9d0,bg=#958a1c] #I #[fg=#dfd9d0,bg=#958a1c,bold] #W#{?window_zoomed_flag,*Z,} #[fg=#958a1c,bg=#efe8dd,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#efe8dd,bg=#dfd9d0,noitalics]#[fg=#5e6063,bg=#dfd9d0] #I #[fg=#5e6063,bg=#dfd9d0] #W#{?window_zoomed_flag,*Z,} #[fg=#dfd9d0,bg=#efe8dd,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
