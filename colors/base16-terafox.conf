# Base16 terafox
# Scheme author: EdenEast (https://github.com/EdenEast)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#e6eaea,bg=#152528"

# default window title colors
set-window-option -g window-status-style "fg=#e6eaea,bg=#152528"

# active window title colors
set-window-option -g window-status-current-style "fg=#fda47f,bg=#152528"

# pane border
set-option -g pane-border-style "fg=#1d3337"
set-option -g pane-active-border-style "fg=#587b7b"

# message text
set-option -g message-style "fg=#cbd9d8,bg=#1d3337"

# pane number display
set-option -g display-panes-active-colour "#587b7b"
set-option -g display-panes-colour "#1d3337"

# clock
set-window-option -g clock-mode-colour "#5a93aa"

# copy mode highlight
set-window-option -g mode-style "fg=#587b7b,bg=#1d3337"

# bell
set-window-option -g window-status-bell-style "fg=#152528,bg=#e85c51"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#e6eaea,bg=#152528"

# style for command messages
set-option -g message-command-style "fg=#cbd9d8,bg=#1d3337"

# Optional active/inactive pane state
# BASE16_TMUX_OPTION_ACTIVE is a legacy variable
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ] || [ "$BASE16_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#e6eaea,bg=#152528"
  set-window-option -g window-style "fg=#e6eaea,bg=#152528"
}

# Optional statusbar
# BASE16_TMUX_OPTION_STATUSBAR is a legacy variable
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ] || [ "$BASE16_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#e6eaea,bg=#254147] #S #[fg=#254147,bg=#152528,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#1d3337,bg=#152528 nobold, nounderscore, noitalics]#[fg=#587b7b,bg=#1d3337] %Y-%m-%d  %H:%M #[fg=#e6eaea,bg=#1d3337,nobold,noitalics,nounderscore]#[fg=#152528,bg=#e6eaea] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#152528,bg=#fda47f,nobold,noitalics,nounderscore]#[fg=#1d3337,bg=#fda47f] #I #[fg=#1d3337,bg=#fda47f,bold] #W#{?window_zoomed_flag,*Z,} #[fg=#fda47f,bg=#152528,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#152528,bg=#1d3337,noitalics]#[fg=#cbd9d8,bg=#1d3337] #I #[fg=#cbd9d8,bg=#1d3337] #W#{?window_zoomed_flag,*Z,} #[fg=#1d3337,bg=#152528,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
