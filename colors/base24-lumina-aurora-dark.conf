# Base24 Lumina Aurora Dark
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#6c647b,bg=#171022"

# default window title colors
set-window-option -g window-status-style "fg=#6c647b,bg=#171022"

# active window title colors
set-window-option -g window-status-current-style "fg=#ffe4b7,bg=#171022"

# pane border
set-option -g pane-border-style "fg=#171022"
set-option -g pane-active-border-style "fg=#6c647b"

# message text
set-option -g message-style "fg=#b3aebe,bg=#20192c"

# pane number display
set-option -g display-panes-active-colour "#6c647b"
set-option -g display-panes-colour "#171022"

# clock
set-window-option -g clock-mode-colour "#b8c5e4"

# copy mode highlight
set-window-option -g mode-style "fg=#6c647b,bg=#20192c"

# bell
set-window-option -g window-status-bell-style "fg=#120c1c,bg=#d45f58"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#d9d5e3,bg=#171022"

# style for command messages
set-option -g message-command-style "fg=#b3aebe,bg=#20192c"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#d9d5e3,bg=#120c1c"
  set-window-option -g window-style "fg=#d9d5e3,bg=#171022"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#d9d5e3,bg=#292336] #S #[fg=#292336,bg=#171022,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#20192c,bg=#171022 nobold, nounderscore, noitalics]#[fg=#6c647b,bg=#20192c] %Y-%m-%d  %H:%M #[fg=#d9d5e3,bg=#20192c,nobold,noitalics,nounderscore]#[fg=#171022,bg=#d9d5e3] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#171022,bg=#fecc74,nobold,noitalics,nounderscore]#[fg=#20192c,bg=#fecc74] #I #[fg=#20192c,bg=#fecc74,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#fecc74,bg=#171022,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#171022,bg=#20192c,noitalics]#[fg=#b3aebe,bg=#20192c] #I #[fg=#b3aebe,bg=#20192c] #W#{?window_zoomed_flag,*Z,}} #[fg=#20192c,bg=#171022,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
