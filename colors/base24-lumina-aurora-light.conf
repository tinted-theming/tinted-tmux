# Base24 Lumina Aurora Light
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#86858b,bg=#f0eff6"

# default window title colors
set-window-option -g window-status-style "fg=#86858b,bg=#f0eff6"

# active window title colors
set-window-option -g window-status-current-style "fg=#815200,bg=#f0eff6"

# pane border
set-option -g pane-border-style "fg=#f0eff6"
set-option -g pane-active-border-style "fg=#86858b"

# message text
set-option -g message-style "fg=#48474c,bg=#e5e3ea"

# pane number display
set-option -g display-panes-active-colour "#86858b"
set-option -g display-panes-colour "#f0eff6"

# clock
set-window-option -g clock-mode-colour "#2765b0"

# copy mode highlight
set-window-option -g mode-style "fg=#86858b,bg=#e5e3ea"

# bell
set-window-option -g window-status-bell-style "fg=#f7f6fb,bg=#860e23"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#302a3b,bg=#f0eff6"

# style for command messages
set-option -g message-command-style "fg=#48474c,bg=#e5e3ea"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#302a3b,bg=#f7f6fb"
  set-window-option -g window-style "fg=#302a3b,bg=#f0eff6"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#302a3b,bg=#d4d3da] #S #[fg=#d4d3da,bg=#f0eff6,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#e5e3ea,bg=#f0eff6 nobold, nounderscore, noitalics]#[fg=#86858b,bg=#e5e3ea] %Y-%m-%d  %H:%M #[fg=#302a3b,bg=#e5e3ea,nobold,noitalics,nounderscore]#[fg=#f0eff6,bg=#302a3b] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#f0eff6,bg=#9b6400,nobold,noitalics,nounderscore]#[fg=#e5e3ea,bg=#9b6400] #I #[fg=#e5e3ea,bg=#9b6400,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#9b6400,bg=#f0eff6,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#f0eff6,bg=#e5e3ea,noitalics]#[fg=#48474c,bg=#e5e3ea] #I #[fg=#48474c,bg=#e5e3ea] #W#{?window_zoomed_flag,*Z,}} #[fg=#e5e3ea,bg=#f0eff6,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
