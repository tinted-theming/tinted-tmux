# Base24 Lumina Canopy Dark
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#617064,bg=#17221a"

# default window title colors
set-window-option -g window-status-style "fg=#617064,bg=#17221a"

# active window title colors
set-window-option -g window-status-current-style "fg=#ffd989,bg=#17221a"

# pane border
set-option -g pane-border-style "fg=#17221a"
set-option -g pane-active-border-style "fg=#617064"

# message text
set-option -g message-style "fg=#abb4ad,bg=#202c24"

# pane number display
set-option -g display-panes-active-colour "#617064"
set-option -g display-panes-colour "#17221a"

# clock
set-window-option -g clock-mode-colour "#8dc6ff"

# copy mode highlight
set-window-option -g mode-style "fg=#617064,bg=#202c24"

# bell
set-window-option -g window-status-bell-style "fg=#131d16,bg=#d3665e"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#cddbd0,bg=#17221a"

# style for command messages
set-option -g message-command-style "fg=#abb4ad,bg=#202c24"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#cddbd0,bg=#131d16"
  set-window-option -g window-style "fg=#cddbd0,bg=#17221a"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#cddbd0,bg=#2a362d] #S #[fg=#2a362d,bg=#17221a,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#202c24,bg=#17221a nobold, nounderscore, noitalics]#[fg=#617064,bg=#202c24] %Y-%m-%d  %H:%M #[fg=#cddbd0,bg=#202c24,nobold,noitalics,nounderscore]#[fg=#17221a,bg=#cddbd0] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#17221a,bg=#f2bb31,nobold,noitalics,nounderscore]#[fg=#202c24,bg=#f2bb31] #I #[fg=#202c24,bg=#f2bb31,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#f2bb31,bg=#17221a,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#17221a,bg=#202c24,noitalics]#[fg=#abb4ad,bg=#202c24] #I #[fg=#abb4ad,bg=#202c24] #W#{?window_zoomed_flag,*Z,}} #[fg=#202c24,bg=#17221a,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
