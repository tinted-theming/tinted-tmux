# Base24 Lumina Canopy Light
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#838882,bg=#e9efe8"

# default window title colors
set-window-option -g window-status-style "fg=#838882,bg=#e9efe8"

# active window title colors
set-window-option -g window-status-current-style "fg=#874e00,bg=#e9efe8"

# pane border
set-option -g pane-border-style "fg=#e9efe8"
set-option -g pane-active-border-style "fg=#838882"

# message text
set-option -g message-style "fg=#454944,bg=#dee3dc"

# pane number display
set-option -g display-panes-active-colour "#838882"
set-option -g display-panes-colour "#e9efe8"

# clock
set-window-option -g clock-mode-colour "#1d5c99"

# copy mode highlight
set-window-option -g mode-style "fg=#838882,bg=#dee3dc"

# bell
set-window-option -g window-status-bell-style "fg=#f1f5f0,bg=#9c2e2c"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#3b433a,bg=#e9efe8"

# style for command messages
set-option -g message-command-style "fg=#454944,bg=#dee3dc"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#3b433a,bg=#f1f5f0"
  set-window-option -g window-style "fg=#3b433a,bg=#e9efe8"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#3b433a,bg=#ced3cc] #S #[fg=#ced3cc,bg=#e9efe8,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#dee3dc,bg=#e9efe8 nobold, nounderscore, noitalics]#[fg=#838882,bg=#dee3dc] %Y-%m-%d  %H:%M #[fg=#3b433a,bg=#dee3dc,nobold,noitalics,nounderscore]#[fg=#e9efe8,bg=#3b433a] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#e9efe8,bg=#a06115,nobold,noitalics,nounderscore]#[fg=#dee3dc,bg=#a06115] #I #[fg=#dee3dc,bg=#a06115,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#a06115,bg=#e9efe8,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#e9efe8,bg=#dee3dc,noitalics]#[fg=#454944,bg=#dee3dc] #I #[fg=#454944,bg=#dee3dc] #W#{?window_zoomed_flag,*Z,}} #[fg=#dee3dc,bg=#e9efe8,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
