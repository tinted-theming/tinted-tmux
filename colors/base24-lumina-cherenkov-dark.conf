# Base24 Lumina Cherenkov Dark
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#5f697d,bg=#0e1525"

# default window title colors
set-window-option -g window-status-style "fg=#5f697d,bg=#0e1525"

# active window title colors
set-window-option -g window-status-current-style "fg=#fcd36b,bg=#0e1525"

# pane border
set-option -g pane-border-style "fg=#0e1525"
set-option -g pane-active-border-style "fg=#5f697d"

# message text
set-option -g message-style "fg=#aab1bf,bg=#161f2f"

# pane number display
set-option -g display-panes-active-colour "#5f697d"
set-option -g display-panes-colour "#0e1525"

# clock
set-window-option -g clock-mode-colour "#c4dbed"

# copy mode highlight
set-window-option -g mode-style "fg=#5f697d,bg=#161f2f"

# bell
set-window-option -g window-status-bell-style "fg=#0a111f,bg=#da6159"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#d0dce9,bg=#0e1525"

# style for command messages
set-option -g message-command-style "fg=#aab1bf,bg=#161f2f"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#d0dce9,bg=#0a111f"
  set-window-option -g window-style "fg=#d0dce9,bg=#0e1525"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#d0dce9,bg=#20283a] #S #[fg=#20283a,bg=#0e1525,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#161f2f,bg=#0e1525 nobold, nounderscore, noitalics]#[fg=#5f697d,bg=#161f2f] %Y-%m-%d  %H:%M #[fg=#d0dce9,bg=#161f2f,nobold,noitalics,nounderscore]#[fg=#0e1525,bg=#d0dce9] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#0e1525,bg=#e0b955,nobold,noitalics,nounderscore]#[fg=#161f2f,bg=#e0b955] #I #[fg=#161f2f,bg=#e0b955,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#e0b955,bg=#0e1525,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#0e1525,bg=#161f2f,noitalics]#[fg=#aab1bf,bg=#161f2f] #I #[fg=#aab1bf,bg=#161f2f] #W#{?window_zoomed_flag,*Z,}} #[fg=#161f2f,bg=#0e1525,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
