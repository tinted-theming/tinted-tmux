# Base24 Lumina Cherenkov Light
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#80878c,bg=#e9f2f7"

# default window title colors
set-window-option -g window-status-style "fg=#80878c,bg=#e9f2f7"

# active window title colors
set-window-option -g window-status-current-style "fg=#874e00,bg=#e9f2f7"

# pane border
set-option -g pane-border-style "fg=#e9f2f7"
set-option -g pane-active-border-style "fg=#80878c"

# message text
set-option -g message-style "fg=#42494d,bg=#dee6ec"

# pane number display
set-option -g display-panes-active-colour "#80878c"
set-option -g display-panes-colour "#e9f2f7"

# clock
set-window-option -g clock-mode-colour "#2c516b"

# copy mode highlight
set-window-option -g mode-style "fg=#80878c,bg=#dee6ec"

# bell
set-window-option -g window-status-bell-style "fg=#f2f8fc,bg=#cb3f3c"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#1e2735,bg=#e9f2f7"

# style for command messages
set-option -g message-command-style "fg=#42494d,bg=#dee6ec"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#1e2735,bg=#f2f8fc"
  set-window-option -g window-style "fg=#1e2735,bg=#e9f2f7"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#1e2735,bg=#ced6db] #S #[fg=#ced6db,bg=#e9f2f7,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#dee6ec,bg=#e9f2f7 nobold, nounderscore, noitalics]#[fg=#80878c,bg=#dee6ec] %Y-%m-%d  %H:%M #[fg=#1e2735,bg=#dee6ec,nobold,noitalics,nounderscore]#[fg=#e9f2f7,bg=#1e2735] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#e9f2f7,bg=#a35f00,nobold,noitalics,nounderscore]#[fg=#dee6ec,bg=#a35f00] #I #[fg=#dee6ec,bg=#a35f00,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#a35f00,bg=#e9f2f7,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#e9f2f7,bg=#dee6ec,noitalics]#[fg=#42494d,bg=#dee6ec] #I #[fg=#42494d,bg=#dee6ec] #W#{?window_zoomed_flag,*Z,}} #[fg=#dee6ec,bg=#e9f2f7,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
