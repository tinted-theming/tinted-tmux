# Base24 Lumina Dusk Dark
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#877489,bg=#38283a"

# default window title colors
set-window-option -g window-status-style "fg=#877489,bg=#38283a"

# active window title colors
set-window-option -g window-status-current-style "fg=#ffe69e,bg=#38283a"

# pane border
set-option -g pane-border-style "fg=#38283a"
set-option -g pane-active-border-style "fg=#877489"

# message text
set-option -g message-style "fg=#b9acba,bg=#423245"

# pane number display
set-option -g display-panes-active-colour "#877489"
set-option -g display-panes-colour "#38283a"

# clock
set-window-option -g clock-mode-colour "#9ec4f7"

# copy mode highlight
set-window-option -g mode-style "fg=#877489,bg=#423245"

# bell
set-window-option -g window-status-bell-style "fg=#322434,bg=#dd7168"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#e6dee8,bg=#38283a"

# style for command messages
set-option -g message-command-style "fg=#b9acba,bg=#423245"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#e6dee8,bg=#322434"
  set-window-option -g window-style "fg=#e6dee8,bg=#38283a"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#e6dee8,bg=#4d3d50] #S #[fg=#4d3d50,bg=#38283a,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#423245,bg=#38283a nobold, nounderscore, noitalics]#[fg=#877489,bg=#423245] %Y-%m-%d  %H:%M #[fg=#e6dee8,bg=#423245,nobold,noitalics,nounderscore]#[fg=#38283a,bg=#e6dee8] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#38283a,bg=#fad975,nobold,noitalics,nounderscore]#[fg=#423245,bg=#fad975] #I #[fg=#423245,bg=#fad975,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#fad975,bg=#38283a,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#38283a,bg=#423245,noitalics]#[fg=#b9acba,bg=#423245] #I #[fg=#b9acba,bg=#423245] #W#{?window_zoomed_flag,*Z,}} #[fg=#423245,bg=#38283a,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
