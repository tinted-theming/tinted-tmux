# Base24 Lumina Dusk Light
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#877e88,bg=#ece2ee"

# default window title colors
set-window-option -g window-status-style "fg=#877e88,bg=#ece2ee"

# active window title colors
set-window-option -g window-status-current-style "fg=#593500,bg=#ece2ee"

# pane border
set-option -g pane-border-style "fg=#ece2ee"
set-option -g pane-active-border-style "fg=#877e88"

# message text
set-option -g message-style "fg=#4c454e,bg=#e1d7e2"

# pane number display
set-option -g display-panes-active-colour "#877e88"
set-option -g display-panes-colour "#ece2ee"

# clock
set-window-option -g clock-mode-colour "#334f9d"

# copy mode highlight
set-window-option -g mode-style "fg=#877e88,bg=#e1d7e2"

# bell
set-window-option -g window-status-bell-style "fg=#f1eaf2,bg=#882322"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#3f3341,bg=#ece2ee"

# style for command messages
set-option -g message-command-style "fg=#4c454e,bg=#e1d7e2"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#3f3341,bg=#f1eaf2"
  set-window-option -g window-style "fg=#3f3341,bg=#ece2ee"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#3f3341,bg=#d0c7d2] #S #[fg=#d0c7d2,bg=#ece2ee,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#e1d7e2,bg=#ece2ee nobold, nounderscore, noitalics]#[fg=#877e88,bg=#e1d7e2] %Y-%m-%d  %H:%M #[fg=#3f3341,bg=#e1d7e2,nobold,noitalics,nounderscore]#[fg=#ece2ee,bg=#3f3341] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#ece2ee,bg=#644c31,nobold,noitalics,nounderscore]#[fg=#e1d7e2,bg=#644c31] #I #[fg=#e1d7e2,bg=#644c31,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#644c31,bg=#ece2ee,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#ece2ee,bg=#e1d7e2,noitalics]#[fg=#4c454e,bg=#e1d7e2] #I #[fg=#4c454e,bg=#e1d7e2] #W#{?window_zoomed_flag,*Z,}} #[fg=#e1d7e2,bg=#ece2ee,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
