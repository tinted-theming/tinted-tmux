# Base24 Lumina Ember Dark
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#706b66,bg=#211e1a"

# default window title colors
set-window-option -g window-status-style "fg=#706b66,bg=#211e1a"

# active window title colors
set-window-option -g window-status-current-style "fg=#f7eb89,bg=#211e1a"

# pane border
set-option -g pane-border-style "fg=#211e1a"
set-option -g pane-active-border-style "fg=#706b66"

# message text
set-option -g message-style "fg=#b3b0ae,bg=#2b2724"

# pane number display
set-option -g display-panes-active-colour "#706b66"
set-option -g display-panes-colour "#211e1a"

# clock
set-window-option -g clock-mode-colour "#78bbea"

# copy mode highlight
set-window-option -g mode-style "fg=#706b66,bg=#2b2724"

# bell
set-window-option -g window-status-bell-style "fg=#1c1916,bg=#d1635b"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#e0d8cb,bg=#211e1a"

# style for command messages
set-option -g message-command-style "fg=#b3b0ae,bg=#2b2724"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#e0d8cb,bg=#1c1916"
  set-window-option -g window-style "fg=#e0d8cb,bg=#211e1a"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#e0d8cb,bg=#35312d] #S #[fg=#35312d,bg=#211e1a,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#2b2724,bg=#211e1a nobold, nounderscore, noitalics]#[fg=#706b66,bg=#2b2724] %Y-%m-%d  %H:%M #[fg=#e0d8cb,bg=#2b2724,nobold,noitalics,nounderscore]#[fg=#211e1a,bg=#e0d8cb] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#211e1a,bg=#e4d874,nobold,noitalics,nounderscore]#[fg=#2b2724,bg=#e4d874] #I #[fg=#2b2724,bg=#e4d874,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#e4d874,bg=#211e1a,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#211e1a,bg=#2b2724,noitalics]#[fg=#b3b0ae,bg=#2b2724] #I #[fg=#b3b0ae,bg=#2b2724] #W#{?window_zoomed_flag,*Z,}} #[fg=#2b2724,bg=#211e1a,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
