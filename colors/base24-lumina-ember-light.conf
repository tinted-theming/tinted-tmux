# Base24 Lumina Ember Light
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#8a867c,bg=#f5f1e6"

# default window title colors
set-window-option -g window-status-style "fg=#8a867c,bg=#f5f1e6"

# active window title colors
set-window-option -g window-status-current-style "fg=#5c3100,bg=#f5f1e6"

# pane border
set-option -g pane-border-style "fg=#f5f1e6"
set-option -g pane-active-border-style "fg=#8a867c"

# message text
set-option -g message-style "fg=#4b473e,bg=#eae6db"

# pane number display
set-option -g display-panes-active-colour "#8a867c"
set-option -g display-panes-colour "#f5f1e6"

# clock
set-window-option -g clock-mode-colour "#3770b0"

# copy mode highlight
set-window-option -g mode-style "fg=#8a867c,bg=#eae6db"

# bell
set-window-option -g window-status-bell-style "fg=#fbf8f0,bg=#972524"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#3d332b,bg=#f5f1e6"

# style for command messages
set-option -g message-command-style "fg=#4b473e,bg=#eae6db"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#3d332b,bg=#fbf8f0"
  set-window-option -g window-style "fg=#3d332b,bg=#f5f1e6"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#3d332b,bg=#d9d5ca] #S #[fg=#d9d5ca,bg=#f5f1e6,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#eae6db,bg=#f5f1e6 nobold, nounderscore, noitalics]#[fg=#8a867c,bg=#eae6db] %Y-%m-%d  %H:%M #[fg=#3d332b,bg=#eae6db,nobold,noitalics,nounderscore]#[fg=#f5f1e6,bg=#3d332b] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#f5f1e6,bg=#68482d,nobold,noitalics,nounderscore]#[fg=#eae6db,bg=#68482d] #I #[fg=#eae6db,bg=#68482d,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#68482d,bg=#f5f1e6,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#f5f1e6,bg=#eae6db,noitalics]#[fg=#4b473e,bg=#eae6db] #I #[fg=#4b473e,bg=#eae6db] #W#{?window_zoomed_flag,*Z,}} #[fg=#eae6db,bg=#f5f1e6,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
