# Base24 Lumina Espresso Dark
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#866e5c,bg=#352114"

# default window title colors
set-window-option -g window-status-style "fg=#866e5c,bg=#352114"

# active window title colors
set-window-option -g window-status-current-style "fg=#ffe3be,bg=#352114"

# pane border
set-option -g pane-border-style "fg=#352114"
set-option -g pane-active-border-style "fg=#866e5c"

# message text
set-option -g message-style "fg=#beada3,bg=#402b1d"

# pane number display
set-option -g display-panes-active-colour "#866e5c"
set-option -g display-panes-colour "#352114"

# clock
set-window-option -g clock-mode-colour "#92bbea"

# copy mode highlight
set-window-option -g mode-style "fg=#866e5c,bg=#402b1d"

# bell
set-window-option -g window-status-bell-style "fg=#2f1d11,bg=#d47169"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#e5dbcd,bg=#352114"

# style for command messages
set-option -g message-command-style "fg=#beada3,bg=#402b1d"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#e5dbcd,bg=#2f1d11"
  set-window-option -g window-style "fg=#e5dbcd,bg=#352114"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#e5dbcd,bg=#4b3527] #S #[fg=#4b3527,bg=#352114,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#402b1d,bg=#352114 nobold, nounderscore, noitalics]#[fg=#866e5c,bg=#402b1d] %Y-%m-%d  %H:%M #[fg=#e5dbcd,bg=#402b1d,nobold,noitalics,nounderscore]#[fg=#352114,bg=#e5dbcd] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#352114,bg=#fdcf90,nobold,noitalics,nounderscore]#[fg=#402b1d,bg=#fdcf90] #I #[fg=#402b1d,bg=#fdcf90,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#fdcf90,bg=#352114,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#352114,bg=#402b1d,noitalics]#[fg=#beada3,bg=#402b1d] #I #[fg=#beada3,bg=#402b1d] #W#{?window_zoomed_flag,*Z,}} #[fg=#402b1d,bg=#352114,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
