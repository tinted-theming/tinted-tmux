# Base24 Lumina Espresso Light
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#928270,bg=#f2e8dc"

# default window title colors
set-window-option -g window-status-style "fg=#928270,bg=#f2e8dc"

# active window title colors
set-window-option -g window-status-current-style "fg=#834a00,bg=#f2e8dc"

# pane border
set-option -g pane-border-style "fg=#f2e8dc"
set-option -g pane-active-border-style "fg=#928270"

# message text
set-option -g message-style "fg=#534533,bg=#e7dcd0"

# pane number display
set-option -g display-panes-active-colour "#928270"
set-option -g display-panes-colour "#f2e8dc"

# clock
set-window-option -g clock-mode-colour "#03679f"

# copy mode highlight
set-window-option -g mode-style "fg=#928270,bg=#e7dcd0"

# bell
set-window-option -g window-status-bell-style "fg=#fbeedf,bg=#cd2e3f"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#322219,bg=#f2e8dc"

# style for command messages
set-option -g message-command-style "fg=#534533,bg=#e7dcd0"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#322219,bg=#fbeedf"
  set-window-option -g window-style "fg=#322219,bg=#f2e8dc"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#322219,bg=#d6ccc0] #S #[fg=#d6ccc0,bg=#f2e8dc,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#e7dcd0,bg=#f2e8dc nobold, nounderscore, noitalics]#[fg=#928270,bg=#e7dcd0] %Y-%m-%d  %H:%M #[fg=#322219,bg=#e7dcd0,nobold,noitalics,nounderscore]#[fg=#f2e8dc,bg=#322219] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#f2e8dc,bg=#9d5c09,nobold,noitalics,nounderscore]#[fg=#e7dcd0,bg=#9d5c09] #I #[fg=#e7dcd0,bg=#9d5c09,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#9d5c09,bg=#f2e8dc,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#f2e8dc,bg=#e7dcd0,noitalics]#[fg=#534533,bg=#e7dcd0] #I #[fg=#534533,bg=#e7dcd0] #W#{?window_zoomed_flag,*Z,}} #[fg=#e7dcd0,bg=#f2e8dc,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
