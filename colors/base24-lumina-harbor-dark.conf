# Base24 Lumina Harbor Dark
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#577192,bg=#0e233f"

# default window title colors
set-window-option -g window-status-style "fg=#577192,bg=#0e233f"

# active window title colors
set-window-option -g window-status-current-style "fg=#fbea87,bg=#0e233f"

# pane border
set-option -g pane-border-style "fg=#0e233f"
set-option -g pane-active-border-style "fg=#577192"

# message text
set-option -g message-style "fg=#a2b2ca,bg=#182d4a"

# pane number display
set-option -g display-panes-active-colour "#577192"
set-option -g display-panes-colour "#0e233f"

# clock
set-window-option -g clock-mode-colour "#87c6f2"

# copy mode highlight
set-window-option -g mode-style "fg=#577192,bg=#182d4a"

# bell
set-window-option -g window-status-bell-style "fg=#0c1e37,bg=#dd6b62"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#cfdceb,bg=#0e233f"

# style for command messages
set-option -g message-command-style "fg=#a2b2ca,bg=#182d4a"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#cfdceb,bg=#0c1e37"
  set-window-option -g window-style "fg=#cfdceb,bg=#0e233f"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#cfdceb,bg=#223755] #S #[fg=#223755,bg=#0e233f,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#182d4a,bg=#0e233f nobold, nounderscore, noitalics]#[fg=#577192,bg=#182d4a] %Y-%m-%d  %H:%M #[fg=#cfdceb,bg=#182d4a,nobold,noitalics,nounderscore]#[fg=#0e233f,bg=#cfdceb] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#0e233f,bg=#e8d66b,nobold,noitalics,nounderscore]#[fg=#182d4a,bg=#e8d66b] #I #[fg=#182d4a,bg=#e8d66b,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#e8d66b,bg=#0e233f,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#0e233f,bg=#182d4a,noitalics]#[fg=#a2b2ca,bg=#182d4a] #I #[fg=#a2b2ca,bg=#182d4a] #W#{?window_zoomed_flag,*Z,}} #[fg=#182d4a,bg=#0e233f,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
