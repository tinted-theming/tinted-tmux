# Base24 Lumina Harbor Light
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#788695,bg=#e0ebf7"

# default window title colors
set-window-option -g window-status-style "fg=#788695,bg=#e0ebf7"

# active window title colors
set-window-option -g window-status-current-style "fg=#884806,bg=#e0ebf7"

# pane border
set-option -g pane-border-style "fg=#e0ebf7"
set-option -g pane-active-border-style "fg=#788695"

# message text
set-option -g message-style "fg=#3c4957,bg=#d4e0eb"

# pane number display
set-option -g display-panes-active-colour "#788695"
set-option -g display-panes-colour "#e0ebf7"

# clock
set-window-option -g clock-mode-colour "#2863ab"

# copy mode highlight
set-window-option -g mode-style "fg=#788695,bg=#d4e0eb"

# bell
set-window-option -g window-status-bell-style "fg=#e6f2fe,bg=#992a28"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#1b2737,bg=#e0ebf7"

# style for command messages
set-option -g message-command-style "fg=#3c4957,bg=#d4e0eb"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#1b2737,bg=#e6f2fe"
  set-window-option -g window-style "fg=#1b2737,bg=#e0ebf7"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#1b2737,bg=#c4cfdb] #S #[fg=#c4cfdb,bg=#e0ebf7,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#d4e0eb,bg=#e0ebf7 nobold, nounderscore, noitalics]#[fg=#788695,bg=#d4e0eb] %Y-%m-%d  %H:%M #[fg=#1b2737,bg=#d4e0eb,nobold,noitalics,nounderscore]#[fg=#e0ebf7,bg=#1b2737] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#e0ebf7,bg=#a55800,nobold,noitalics,nounderscore]#[fg=#d4e0eb,bg=#a55800] #I #[fg=#d4e0eb,bg=#a55800,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#a55800,bg=#e0ebf7,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#e0ebf7,bg=#d4e0eb,noitalics]#[fg=#3c4957,bg=#d4e0eb] #I #[fg=#3c4957,bg=#d4e0eb] #W#{?window_zoomed_flag,*Z,}} #[fg=#d4e0eb,bg=#e0ebf7,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
