# Base24 Lumina Lagoon Dark
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#64828b,bg=#1b343c"

# default window title colors
set-window-option -g window-status-style "fg=#64828b,bg=#1b343c"

# active window title colors
set-window-option -g window-status-current-style "fg=#fbe68b,bg=#1b343c"

# pane border
set-option -g pane-border-style "fg=#1b343c"
set-option -g pane-active-border-style "fg=#64828b"

# message text
set-option -g message-style "fg=#a2b5bb,bg=#253f47"

# pane number display
set-option -g display-panes-active-colour "#64828b"
set-option -g display-panes-colour "#1b343c"

# clock
set-window-option -g clock-mode-colour "#a0c7f9"

# copy mode highlight
set-window-option -g mode-style "fg=#64828b,bg=#253f47"

# bell
set-window-option -g window-status-bell-style "fg=#182f36,bg=#df7370"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#d4e5ea,bg=#1b343c"

# style for command messages
set-option -g message-command-style "fg=#a2b5bb,bg=#253f47"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#d4e5ea,bg=#182f36"
  set-window-option -g window-style "fg=#d4e5ea,bg=#1b343c"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#d4e5ea,bg=#2f4952] #S #[fg=#2f4952,bg=#1b343c,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#253f47,bg=#1b343c nobold, nounderscore, noitalics]#[fg=#64828b,bg=#253f47] %Y-%m-%d  %H:%M #[fg=#d4e5ea,bg=#253f47,nobold,noitalics,nounderscore]#[fg=#1b343c,bg=#d4e5ea] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#1b343c,bg=#dfcc78,nobold,noitalics,nounderscore]#[fg=#253f47,bg=#dfcc78] #I #[fg=#253f47,bg=#dfcc78,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#dfcc78,bg=#1b343c,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#1b343c,bg=#253f47,noitalics]#[fg=#a2b5bb,bg=#253f47] #I #[fg=#a2b5bb,bg=#253f47] #W#{?window_zoomed_flag,*Z,}} #[fg=#253f47,bg=#1b343c,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
