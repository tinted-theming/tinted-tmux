# Base24 Lumina Lagoon Light
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#7b898c,bg=#e4f3f6"

# default window title colors
set-window-option -g window-status-style "fg=#7b898c,bg=#e4f3f6"

# active window title colors
set-window-option -g window-status-current-style "fg=#855100,bg=#e4f3f6"

# pane border
set-option -g pane-border-style "fg=#e4f3f6"
set-option -g pane-active-border-style "fg=#7b898c"

# message text
set-option -g message-style "fg=#3e4a4d,bg=#d8e8ea"

# pane number display
set-option -g display-panes-active-colour "#7b898c"
set-option -g display-panes-colour "#e4f3f6"

# clock
set-window-option -g clock-mode-colour "#1e69a2"

# copy mode highlight
set-window-option -g mode-style "fg=#7b898c,bg=#d8e8ea"

# bell
set-window-option -g window-status-bell-style "fg=#eef9fb,bg=#901f1f"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#212829,bg=#e4f3f6"

# style for command messages
set-option -g message-command-style "fg=#3e4a4d,bg=#d8e8ea"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#212829,bg=#eef9fb"
  set-window-option -g window-style "fg=#212829,bg=#e4f3f6"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#212829,bg=#c8d7da] #S #[fg=#c8d7da,bg=#e4f3f6,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#d8e8ea,bg=#e4f3f6 nobold, nounderscore, noitalics]#[fg=#7b898c,bg=#d8e8ea] %Y-%m-%d  %H:%M #[fg=#212829,bg=#d8e8ea,nobold,noitalics,nounderscore]#[fg=#e4f3f6,bg=#212829] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#e4f3f6,bg=#a06200,nobold,noitalics,nounderscore]#[fg=#d8e8ea,bg=#a06200] #I #[fg=#d8e8ea,bg=#a06200,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#a06200,bg=#e4f3f6,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#e4f3f6,bg=#d8e8ea,noitalics]#[fg=#3e4a4d,bg=#d8e8ea] #I #[fg=#3e4a4d,bg=#d8e8ea] #W#{?window_zoomed_flag,*Z,}} #[fg=#d8e8ea,bg=#e4f3f6,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
