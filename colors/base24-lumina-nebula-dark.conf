# Base24 Lumina Nebula Dark
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#606a77,bg=#0e1520"

# default window title colors
set-window-option -g window-status-style "fg=#606a77,bg=#0e1520"

# active window title colors
set-window-option -g window-status-current-style "fg=#ffe6a0,bg=#0e1520"

# pane border
set-option -g pane-border-style "fg=#0e1520"
set-option -g pane-active-border-style "fg=#606a77"

# message text
set-option -g message-style "fg=#abb2bb,bg=#171f29"

# pane number display
set-option -g display-panes-active-colour "#606a77"
set-option -g display-panes-colour "#0e1520"

# clock
set-window-option -g clock-mode-colour "#92bef8"

# copy mode highlight
set-window-option -g mode-style "fg=#606a77,bg=#171f29"

# bell
set-window-option -g window-status-bell-style "fg=#0a111a,bg=#d36059"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#cadceb,bg=#0e1520"

# style for command messages
set-option -g message-command-style "fg=#abb2bb,bg=#171f29"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#cadceb,bg=#0a111a"
  set-window-option -g window-style "fg=#cadceb,bg=#0e1520"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#cadceb,bg=#202833] #S #[fg=#202833,bg=#0e1520,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#171f29,bg=#0e1520 nobold, nounderscore, noitalics]#[fg=#606a77,bg=#171f29] %Y-%m-%d  %H:%M #[fg=#cadceb,bg=#171f29,nobold,noitalics,nounderscore]#[fg=#0e1520,bg=#cadceb] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#0e1520,bg=#f7cf55,nobold,noitalics,nounderscore]#[fg=#171f29,bg=#f7cf55] #I #[fg=#171f29,bg=#f7cf55,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#f7cf55,bg=#0e1520,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#0e1520,bg=#171f29,noitalics]#[fg=#abb2bb,bg=#171f29] #I #[fg=#abb2bb,bg=#171f29] #W#{?window_zoomed_flag,*Z,}} #[fg=#171f29,bg=#0e1520,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
