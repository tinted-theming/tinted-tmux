# Base24 Lumina Nebula Light
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#84868a,bg=#eff1f6"

# default window title colors
set-window-option -g window-status-style "fg=#84868a,bg=#eff1f6"

# active window title colors
set-window-option -g window-status-current-style "fg=#7e4e00,bg=#eff1f6"

# pane border
set-option -g pane-border-style "fg=#eff1f6"
set-option -g pane-active-border-style "fg=#84868a"

# message text
set-option -g message-style "fg=#46484b,bg=#e3e6ea"

# pane number display
set-option -g display-panes-active-colour "#84868a"
set-option -g display-panes-colour "#eff1f6"

# clock
set-window-option -g clock-mode-colour "#34639e"

# copy mode highlight
set-window-option -g mode-style "fg=#84868a,bg=#e3e6ea"

# bell
set-window-option -g window-status-bell-style "fg=#f6f8fb,bg=#902725"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#1f2a38,bg=#eff1f6"

# style for command messages
set-option -g message-command-style "fg=#46484b,bg=#e3e6ea"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#1f2a38,bg=#f6f8fb"
  set-window-option -g window-style "fg=#1f2a38,bg=#eff1f6"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#1f2a38,bg=#d3d5da] #S #[fg=#d3d5da,bg=#eff1f6,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#e3e6ea,bg=#eff1f6 nobold, nounderscore, noitalics]#[fg=#84868a,bg=#e3e6ea] %Y-%m-%d  %H:%M #[fg=#1f2a38,bg=#e3e6ea,nobold,noitalics,nounderscore]#[fg=#eff1f6,bg=#1f2a38] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#eff1f6,bg=#996000,nobold,noitalics,nounderscore]#[fg=#e3e6ea,bg=#996000] #I #[fg=#e3e6ea,bg=#996000,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#996000,bg=#eff1f6,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#eff1f6,bg=#e3e6ea,noitalics]#[fg=#46484b,bg=#e3e6ea] #I #[fg=#46484b,bg=#e3e6ea] #W#{?window_zoomed_flag,*Z,}} #[fg=#e3e6ea,bg=#eff1f6,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
