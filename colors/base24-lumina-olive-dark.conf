# Base24 Lumina Olive Dark
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#6f755c,bg=#262814"

# default window title colors
set-window-option -g window-status-style "fg=#6f755c,bg=#262814"

# active window title colors
set-window-option -g window-status-current-style "fg=#ffd7a6,bg=#262814"

# pane border
set-option -g pane-border-style "fg=#262814"
set-option -g pane-active-border-style "fg=#6f755c"

# message text
set-option -g message-style "fg=#b1b3a3,bg=#30321d"

# pane number display
set-option -g display-panes-active-colour "#6f755c"
set-option -g display-panes-colour "#262814"

# clock
set-window-option -g clock-mode-colour "#8fb9f7"

# copy mode highlight
set-window-option -g mode-style "fg=#6f755c,bg=#30321d"

# bell
set-window-option -g window-status-bell-style "fg=#212311,bg=#cd6f71"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#dfddce,bg=#262814"

# style for command messages
set-option -g message-command-style "fg=#b1b3a3,bg=#30321d"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#dfddce,bg=#212311"
  set-window-option -g window-style "fg=#dfddce,bg=#262814"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#dfddce,bg=#3a3c27] #S #[fg=#3a3c27,bg=#262814,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#30321d,bg=#262814 nobold, nounderscore, noitalics]#[fg=#6f755c,bg=#30321d] %Y-%m-%d  %H:%M #[fg=#dfddce,bg=#30321d,nobold,noitalics,nounderscore]#[fg=#262814,bg=#dfddce] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#262814,bg=#edba7a,nobold,noitalics,nounderscore]#[fg=#30321d,bg=#edba7a] #I #[fg=#30321d,bg=#edba7a,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#edba7a,bg=#262814,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#262814,bg=#30321d,noitalics]#[fg=#b1b3a3,bg=#30321d] #I #[fg=#b1b3a3,bg=#30321d] #W#{?window_zoomed_flag,*Z,}} #[fg=#30321d,bg=#262814,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
