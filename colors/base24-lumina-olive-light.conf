# Base24 Lumina Olive Light
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#878568,bg=#e9e9da"

# default window title colors
set-window-option -g window-status-style "fg=#878568,bg=#e9e9da"

# active window title colors
set-window-option -g window-status-current-style "fg=#7b4c00,bg=#e9e9da"

# pane border
set-option -g pane-border-style "fg=#e9e9da"
set-option -g pane-active-border-style "fg=#878568"

# message text
set-option -g message-style "fg=#4b492e,bg=#deddce"

# pane number display
set-option -g display-panes-active-colour "#878568"
set-option -g display-panes-colour "#e9e9da"

# clock
set-window-option -g clock-mode-colour "#2e5ba6"

# copy mode highlight
set-window-option -g mode-style "fg=#878568,bg=#deddce"

# bell
set-window-option -g window-status-bell-style "fg=#f1f0d9,bg=#861d1d"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#262816,bg=#e9e9da"

# style for command messages
set-option -g message-command-style "fg=#4b492e,bg=#deddce"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#262816,bg=#f1f0d9"
  set-window-option -g window-style "fg=#262816,bg=#e9e9da"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#262816,bg=#cecdbe] #S #[fg=#cecdbe,bg=#e9e9da,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#deddce,bg=#e9e9da nobold, nounderscore, noitalics]#[fg=#878568,bg=#deddce] %Y-%m-%d  %H:%M #[fg=#262816,bg=#deddce,nobold,noitalics,nounderscore]#[fg=#e9e9da,bg=#262816] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#e9e9da,bg=#955e00,nobold,noitalics,nounderscore]#[fg=#deddce,bg=#955e00] #I #[fg=#deddce,bg=#955e00,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#955e00,bg=#e9e9da,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#e9e9da,bg=#deddce,noitalics]#[fg=#4b492e,bg=#deddce] #I #[fg=#4b492e,bg=#deddce] #W#{?window_zoomed_flag,*Z,}} #[fg=#deddce,bg=#e9e9da,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
