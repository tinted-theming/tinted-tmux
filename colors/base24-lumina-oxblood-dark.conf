# Base24 Lumina Oxblood Dark
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#79686d,bg=#291b20"

# default window title colors
set-window-option -g window-status-style "fg=#79686d,bg=#291b20"

# active window title colors
set-window-option -g window-status-current-style "fg=#ffe4b8,bg=#291b20"

# pane border
set-option -g pane-border-style "fg=#291b20"
set-option -g pane-active-border-style "fg=#79686d"

# message text
set-option -g message-style "fg=#b9adb1,bg=#332529"

# pane number display
set-option -g display-panes-active-colour "#79686d"
set-option -g display-panes-colour "#291b20"

# clock
set-window-option -g clock-mode-colour "#96c3fb"

# copy mode highlight
set-window-option -g mode-style "fg=#79686d,bg=#332529"

# bell
set-window-option -g window-status-bell-style "fg=#23171b,bg=#de6961"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#e4d2d7,bg=#291b20"

# style for command messages
set-option -g message-command-style "fg=#b9adb1,bg=#332529"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#e4d2d7,bg=#23171b"
  set-window-option -g window-style "fg=#e4d2d7,bg=#291b20"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#e4d2d7,bg=#3d2f33] #S #[fg=#3d2f33,bg=#291b20,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#332529,bg=#291b20 nobold, nounderscore, noitalics]#[fg=#79686d,bg=#332529] %Y-%m-%d  %H:%M #[fg=#e4d2d7,bg=#332529,nobold,noitalics,nounderscore]#[fg=#291b20,bg=#e4d2d7] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#291b20,bg=#f9c875,nobold,noitalics,nounderscore]#[fg=#332529,bg=#f9c875] #I #[fg=#332529,bg=#f9c875,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#f9c875,bg=#291b20,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#291b20,bg=#332529,noitalics]#[fg=#b9adb1,bg=#332529] #I #[fg=#b9adb1,bg=#332529] #W#{?window_zoomed_flag,*Z,}} #[fg=#332529,bg=#291b20,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
