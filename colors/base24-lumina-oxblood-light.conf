# Base24 Lumina Oxblood Light
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#8a8486,bg=#f4edee"

# default window title colors
set-window-option -g window-status-style "fg=#8a8486,bg=#f4edee"

# active window title colors
set-window-option -g window-status-current-style "fg=#845000,bg=#f4edee"

# pane border
set-option -g pane-border-style "fg=#f4edee"
set-option -g pane-active-border-style "fg=#8a8486"

# message text
set-option -g message-style "fg=#4c4647,bg=#e8e1e3"

# pane number display
set-option -g display-panes-active-colour "#8a8486"
set-option -g display-panes-colour "#f4edee"

# clock
set-window-option -g clock-mode-colour "#35659f"

# copy mode highlight
set-window-option -g mode-style "fg=#8a8486,bg=#e8e1e3"

# bell
set-window-option -g window-status-bell-style "fg=#f9f4f5,bg=#982e24"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#4f3c45,bg=#f4edee"

# style for command messages
set-option -g message-command-style "fg=#4c4647,bg=#e8e1e3"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#4f3c45,bg=#f9f4f5"
  set-window-option -g window-style "fg=#4f3c45,bg=#f4edee"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#4f3c45,bg=#d8d1d2] #S #[fg=#d8d1d2,bg=#f4edee,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#e8e1e3,bg=#f4edee nobold, nounderscore, noitalics]#[fg=#8a8486,bg=#e8e1e3] %Y-%m-%d  %H:%M #[fg=#4f3c45,bg=#e8e1e3,nobold,noitalics,nounderscore]#[fg=#f4edee,bg=#4f3c45] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#f4edee,bg=#9f6202,nobold,noitalics,nounderscore]#[fg=#e8e1e3,bg=#9f6202] #I #[fg=#e8e1e3,bg=#9f6202,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#9f6202,bg=#f4edee,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#f4edee,bg=#e8e1e3,noitalics]#[fg=#4c4647,bg=#e8e1e3] #I #[fg=#4c4647,bg=#e8e1e3] #W#{?window_zoomed_flag,*Z,}} #[fg=#e8e1e3,bg=#f4edee,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
