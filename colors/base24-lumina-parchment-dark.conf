# Base24 Lumina Parchment Dark
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#877e6d,bg=#3a3224"

# default window title colors
set-window-option -g window-status-style "fg=#877e6d,bg=#3a3224"

# active window title colors
set-window-option -g window-status-current-style "fg=#ffe4b3,bg=#3a3224"

# pane border
set-option -g pane-border-style "fg=#3a3224"
set-option -g pane-active-border-style "fg=#877e6d"

# message text
set-option -g message-style "fg=#b6b0a6,bg=#443c2e"

# pane number display
set-option -g display-panes-active-colour "#877e6d"
set-option -g display-panes-colour "#3a3224"

# clock
set-window-option -g clock-mode-colour "#9ebde6"

# copy mode highlight
set-window-option -g mode-style "fg=#877e6d,bg=#443c2e"

# bell
set-window-option -g window-status-bell-style "fg=#342d21,bg=#db7d75"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#eee7d9,bg=#3a3224"

# style for command messages
set-option -g message-command-style "fg=#b6b0a6,bg=#443c2e"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#eee7d9,bg=#342d21"
  set-window-option -g window-style "fg=#eee7d9,bg=#3a3224"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#eee7d9,bg=#4f4739] #S #[fg=#4f4739,bg=#3a3224,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#443c2e,bg=#3a3224 nobold, nounderscore, noitalics]#[fg=#877e6d,bg=#443c2e] %Y-%m-%d  %H:%M #[fg=#eee7d9,bg=#443c2e,nobold,noitalics,nounderscore]#[fg=#3a3224,bg=#eee7d9] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#3a3224,bg=#f3cb7f,nobold,noitalics,nounderscore]#[fg=#443c2e,bg=#f3cb7f] #I #[fg=#443c2e,bg=#f3cb7f,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#f3cb7f,bg=#3a3224,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#3a3224,bg=#443c2e,noitalics]#[fg=#b6b0a6,bg=#443c2e] #I #[fg=#b6b0a6,bg=#443c2e] #W#{?window_zoomed_flag,*Z,}} #[fg=#443c2e,bg=#3a3224,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
