# Base24 Lumina Parchment Light
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#8c7f63,bg=#e9e3d5"

# default window title colors
set-window-option -g window-status-style "fg=#8c7f63,bg=#e9e3d5"

# active window title colors
set-window-option -g window-status-current-style "fg=#764a00,bg=#e9e3d5"

# pane border
set-option -g pane-border-style "fg=#e9e3d5"
set-option -g pane-active-border-style "fg=#8c7f63"

# message text
set-option -g message-style "fg=#52462b,bg=#ddd7c9"

# pane number display
set-option -g display-panes-active-colour "#8c7f63"
set-option -g display-panes-colour "#e9e3d5"

# clock
set-window-option -g clock-mode-colour "#2b5a94"

# copy mode highlight
set-window-option -g mode-style "fg=#8c7f63,bg=#ddd7c9"

# bell
set-window-option -g window-status-bell-style "fg=#f3e9d2,bg=#811d1d"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#302416,bg=#e9e3d5"

# style for command messages
set-option -g message-command-style "fg=#52462b,bg=#ddd7c9"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#302416,bg=#f3e9d2"
  set-window-option -g window-style "fg=#302416,bg=#e9e3d5"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#302416,bg=#cdc7b9] #S #[fg=#cdc7b9,bg=#e9e3d5,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#ddd7c9,bg=#e9e3d5 nobold, nounderscore, noitalics]#[fg=#8c7f63,bg=#ddd7c9] %Y-%m-%d  %H:%M #[fg=#302416,bg=#ddd7c9,nobold,noitalics,nounderscore]#[fg=#e9e3d5,bg=#302416] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#e9e3d5,bg=#905c00,nobold,noitalics,nounderscore]#[fg=#ddd7c9,bg=#905c00] #I #[fg=#ddd7c9,bg=#905c00,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#905c00,bg=#e9e3d5,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#e9e3d5,bg=#ddd7c9,noitalics]#[fg=#52462b,bg=#ddd7c9] #I #[fg=#52462b,bg=#ddd7c9] #W#{?window_zoomed_flag,*Z,}} #[fg=#ddd7c9,bg=#e9e3d5,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
