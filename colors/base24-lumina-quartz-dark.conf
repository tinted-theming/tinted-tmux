# Base24 Lumina Quartz Dark
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#6b6d6e,bg=#1f2021"

# default window title colors
set-window-option -g window-status-style "fg=#6b6d6e,bg=#1f2021"

# active window title colors
set-window-option -g window-status-current-style "fg=#f9d57d,bg=#1f2021"

# pane border
set-option -g pane-border-style "fg=#1f2021"
set-option -g pane-active-border-style "fg=#6b6d6e"

# message text
set-option -g message-style "fg=#b0b1b2,bg=#28292a"

# pane number display
set-option -g display-panes-active-colour "#6b6d6e"
set-option -g display-panes-colour "#1f2021"

# clock
set-window-option -g clock-mode-colour "#9cc2f4"

# copy mode highlight
set-window-option -g mode-style "fg=#6b6d6e,bg=#28292a"

# bell
set-window-option -g window-status-bell-style "fg=#1a1b1c,bg=#d96e66"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#cdd0d4,bg=#1f2021"

# style for command messages
set-option -g message-command-style "fg=#b0b1b2,bg=#28292a"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#cdd0d4,bg=#1a1b1c"
  set-window-option -g window-style "fg=#cdd0d4,bg=#1f2021"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#cdd0d4,bg=#323334] #S #[fg=#323334,bg=#1f2021,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#28292a,bg=#1f2021 nobold, nounderscore, noitalics]#[fg=#6b6d6e,bg=#28292a] %Y-%m-%d  %H:%M #[fg=#cdd0d4,bg=#28292a,nobold,noitalics,nounderscore]#[fg=#1f2021,bg=#cdd0d4] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#1f2021,bg=#ddbb67,nobold,noitalics,nounderscore]#[fg=#28292a,bg=#ddbb67] #I #[fg=#28292a,bg=#ddbb67,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#ddbb67,bg=#1f2021,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#1f2021,bg=#28292a,noitalics]#[fg=#b0b1b2,bg=#28292a] #I #[fg=#b0b1b2,bg=#28292a] #W#{?window_zoomed_flag,*Z,}} #[fg=#28292a,bg=#1f2021,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
