# Base24 Lumina Quartz Light
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#858687,bg=#eff0f2"

# default window title colors
set-window-option -g window-status-style "fg=#858687,bg=#eff0f2"

# active window title colors
set-window-option -g window-status-current-style "fg=#874e00,bg=#eff0f2"

# pane border
set-option -g pane-border-style "fg=#eff0f2"
set-option -g pane-active-border-style "fg=#858687"

# message text
set-option -g message-style "fg=#474849,bg=#e3e5e6"

# pane number display
set-option -g display-panes-active-colour "#858687"
set-option -g display-panes-colour "#eff0f2"

# clock
set-window-option -g clock-mode-colour "#3566a4"

# copy mode highlight
set-window-option -g mode-style "fg=#858687,bg=#e3e5e6"

# bell
set-window-option -g window-status-bell-style "fg=#f6f7f8,bg=#861d1d"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#404246,bg=#eff0f2"

# style for command messages
set-option -g message-command-style "fg=#474849,bg=#e3e5e6"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#404246,bg=#f6f7f8"
  set-window-option -g window-style "fg=#404246,bg=#eff0f2"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#404246,bg=#d3d4d6] #S #[fg=#d3d4d6,bg=#eff0f2,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#e3e5e6,bg=#eff0f2 nobold, nounderscore, noitalics]#[fg=#858687,bg=#e3e5e6] %Y-%m-%d  %H:%M #[fg=#404246,bg=#e3e5e6,nobold,noitalics,nounderscore]#[fg=#eff0f2,bg=#404246] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#eff0f2,bg=#a16011,nobold,noitalics,nounderscore]#[fg=#e3e5e6,bg=#a16011] #I #[fg=#e3e5e6,bg=#a16011,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#a16011,bg=#eff0f2,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#eff0f2,bg=#e3e5e6,noitalics]#[fg=#474849,bg=#e3e5e6] #I #[fg=#474849,bg=#e3e5e6] #W#{?window_zoomed_flag,*Z,}} #[fg=#e3e5e6,bg=#eff0f2,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
