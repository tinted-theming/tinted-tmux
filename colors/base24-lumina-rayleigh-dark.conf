# Base24 Lumina Rayleigh Dark
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#636b87,bg=#181c33"

# default window title colors
set-window-option -g window-status-style "fg=#636b87,bg=#181c33"

# active window title colors
set-window-option -g window-status-current-style "fg=#ffe4b4,bg=#181c33"

# pane border
set-option -g pane-border-style "fg=#181c33"
set-option -g pane-active-border-style "fg=#636b87"

# message text
set-option -g message-style "fg=#abb0c3,bg=#21263d"

# pane number display
set-option -g display-panes-active-colour "#636b87"
set-option -g display-panes-colour "#181c33"

# clock
set-window-option -g clock-mode-colour "#7cbdff"

# copy mode highlight
set-window-option -g mode-style "fg=#636b87,bg=#21263d"

# bell
set-window-option -g window-status-bell-style "fg=#14182c,bg=#da6d65"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#d4dbea,bg=#181c33"

# style for command messages
set-option -g message-command-style "fg=#abb0c3,bg=#21263d"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#d4dbea,bg=#14182c"
  set-window-option -g window-style "fg=#d4dbea,bg=#181c33"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#d4dbea,bg=#2b3048] #S #[fg=#2b3048,bg=#181c33,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#21263d,bg=#181c33 nobold, nounderscore, noitalics]#[fg=#636b87,bg=#21263d] %Y-%m-%d  %H:%M #[fg=#d4dbea,bg=#21263d,nobold,noitalics,nounderscore]#[fg=#181c33,bg=#d4dbea] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#181c33,bg=#f8c970,nobold,noitalics,nounderscore]#[fg=#21263d,bg=#f8c970] #I #[fg=#21263d,bg=#f8c970,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#f8c970,bg=#181c33,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#181c33,bg=#21263d,noitalics]#[fg=#abb0c3,bg=#21263d] #I #[fg=#abb0c3,bg=#21263d] #W#{?window_zoomed_flag,*Z,}} #[fg=#21263d,bg=#181c33,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
