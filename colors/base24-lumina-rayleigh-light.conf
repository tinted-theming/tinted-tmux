# Base24 Lumina Rayleigh Light
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#82878b,bg=#eff5f9"

# default window title colors
set-window-option -g window-status-style "fg=#82878b,bg=#eff5f9"

# active window title colors
set-window-option -g window-status-current-style "fg=#815200,bg=#eff5f9"

# pane border
set-option -g pane-border-style "fg=#eff5f9"
set-option -g pane-active-border-style "fg=#82878b"

# message text
set-option -g message-style "fg=#44484c,bg=#e3e9ed"

# pane number display
set-option -g display-panes-active-colour "#82878b"
set-option -g display-panes-colour "#eff5f9"

# clock
set-window-option -g clock-mode-colour "#0555b7"

# copy mode highlight
set-window-option -g mode-style "fg=#82878b,bg=#e3e9ed"

# bell
set-window-option -g window-status-bell-style "fg=#f7fbfe,bg=#941419"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#1d2638,bg=#eff5f9"

# style for command messages
set-option -g message-command-style "fg=#44484c,bg=#e3e9ed"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#1d2638,bg=#f7fbfe"
  set-window-option -g window-style "fg=#1d2638,bg=#eff5f9"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#1d2638,bg=#d3d9dd] #S #[fg=#d3d9dd,bg=#eff5f9,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#e3e9ed,bg=#eff5f9 nobold, nounderscore, noitalics]#[fg=#82878b,bg=#e3e9ed] %Y-%m-%d  %H:%M #[fg=#1d2638,bg=#e3e9ed,nobold,noitalics,nounderscore]#[fg=#eff5f9,bg=#1d2638] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#eff5f9,bg=#9b6400,nobold,noitalics,nounderscore]#[fg=#e3e9ed,bg=#9b6400] #I #[fg=#e3e9ed,bg=#9b6400,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#9b6400,bg=#eff5f9,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#eff5f9,bg=#e3e9ed,noitalics]#[fg=#44484c,bg=#e3e9ed] #I #[fg=#44484c,bg=#e3e9ed] #W#{?window_zoomed_flag,*Z,}} #[fg=#e3e9ed,bg=#eff5f9,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
