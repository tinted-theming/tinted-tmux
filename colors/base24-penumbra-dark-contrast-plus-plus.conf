# Base24 Penumbra Dark Contrast Plus Plus
# Scheme author: Neal McKee (https://github.com/nealmckee/penumbra)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#88898b,bg=#1b1e23"

# default window title colors
set-window-option -g window-status-style "fg=#88898b,bg=#1b1e23"

# active window title colors
set-window-option -g window-status-current-style "fg=#b4a724,bg=#1b1e23"

# pane border
set-option -g pane-border-style "fg=#1b1e23"
set-option -g pane-active-border-style "fg=#88898b"

# message text
set-option -g message-style "fg=#c2c0bd,bg=#393c42"

# pane number display
set-option -g display-panes-active-colour "#88898b"
set-option -g display-panes-colour "#1b1e23"

# clock
set-window-option -g clock-mode-colour "#009edb"

# copy mode highlight
set-window-option -g mode-style "fg=#88898b,bg=#393c42"

# bell
set-window-option -g window-status-bell-style "fg=#101317,bg=#e17782"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#a9a9a9,bg=#1b1e23"

# style for command messages
set-option -g message-command-style "fg=#c2c0bd,bg=#393c42"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#a9a9a9,bg=#101317"
  set-window-option -g window-style "fg=#a9a9a9,bg=#1b1e23"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#a9a9a9,bg=#575b62] #S #[fg=#575b62,bg=#1b1e23,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#393c42,bg=#1b1e23 nobold, nounderscore, noitalics]#[fg=#88898b,bg=#393c42] %Y-%m-%d  %H:%M #[fg=#a9a9a9,bg=#393c42,nobold,noitalics,nounderscore]#[fg=#1b1e23,bg=#a9a9a9] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#1b1e23,bg=#b4a724,nobold,noitalics,nounderscore]#[fg=#393c42,bg=#b4a724] #I #[fg=#393c42,bg=#b4a724,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#b4a724,bg=#1b1e23,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#1b1e23,bg=#393c42,noitalics]#[fg=#c2c0bd,bg=#393c42] #I #[fg=#c2c0bd,bg=#393c42] #W#{?window_zoomed_flag,*Z,}} #[fg=#393c42,bg=#1b1e23,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
