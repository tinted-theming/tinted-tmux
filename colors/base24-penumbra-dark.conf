# Base24 Penumbra Dark
# Scheme author: Neal McKee (https://github.com/nealmckee/penumbra)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#777879,bg=#383a3d"

# default window title colors
set-window-option -g window-status-style "fg=#777879,bg=#383a3d"

# active window title colors
set-window-option -g window-status-current-style "fg=#948a1d,bg=#383a3d"

# pane border
set-option -g pane-border-style "fg=#383a3d"
set-option -g pane-active-border-style "fg=#777879"

# message text
set-option -g message-style "fg=#b4b1ad,bg=#484a4d"

# pane number display
set-option -g display-panes-active-colour "#777879"
set-option -g display-panes-colour "#383a3d"

# clock
set-window-option -g clock-mode-colour "#0081b4"

# copy mode highlight
set-window-option -g mode-style "fg=#777879,bg=#484a4d"

# bell
set-window-option -g window-status-bell-style "fg=#2c2e31,bg=#ba616a"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#8b8b8b,bg=#383a3d"

# style for command messages
set-option -g message-command-style "fg=#b4b1ad,bg=#484a4d"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#8b8b8b,bg=#2c2e31"
  set-window-option -g window-style "fg=#8b8b8b,bg=#383a3d"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#8b8b8b,bg=#5e6063] #S #[fg=#5e6063,bg=#383a3d,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#484a4d,bg=#383a3d nobold, nounderscore, noitalics]#[fg=#777879,bg=#484a4d] %Y-%m-%d  %H:%M #[fg=#8b8b8b,bg=#484a4d,nobold,noitalics,nounderscore]#[fg=#383a3d,bg=#8b8b8b] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#383a3d,bg=#948a1d,nobold,noitalics,nounderscore]#[fg=#484a4d,bg=#948a1d] #I #[fg=#484a4d,bg=#948a1d,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#948a1d,bg=#383a3d,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#383a3d,bg=#484a4d,noitalics]#[fg=#b4b1ad,bg=#484a4d] #I #[fg=#b4b1ad,bg=#484a4d] #W#{?window_zoomed_flag,*Z,}} #[fg=#484a4d,bg=#383a3d,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
