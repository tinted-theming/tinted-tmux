# Base24 Stranger Theme Dimension X
# Scheme author: Stranger Theme (https://github.com/stranger-theme/stranger-theme)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#b8a5a5,bg=#322e2e"

# default window title colors
set-window-option -g window-status-style "fg=#b8a5a5,bg=#322e2e"

# active window title colors
set-window-option -g window-status-current-style "fg=#efb884,bg=#322e2e"

# pane border
set-option -g pane-border-style "fg=#322e2e"
set-option -g pane-active-border-style "fg=#b8a5a5"

# message text
set-option -g message-style "fg=#f4e1e1,bg=#523535"

# pane number display
set-option -g display-panes-active-colour "#b8a5a5"
set-option -g display-panes-colour "#322e2e"

# clock
set-window-option -g clock-mode-colour "#c678dd"

# copy mode highlight
set-window-option -g mode-style "fg=#b8a5a5,bg=#523535"

# bell
set-window-option -g window-status-bell-style "fg=#1e1a1a,bg=#ff6b6b"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#e8d5d5,bg=#322e2e"

# style for command messages
set-option -g message-command-style "fg=#f4e1e1,bg=#523535"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#e8d5d5,bg=#1e1a1a"
  set-window-option -g window-style "fg=#e8d5d5,bg=#322e2e"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#e8d5d5,bg=#9a7c7c] #S #[fg=#9a7c7c,bg=#322e2e,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#523535,bg=#322e2e nobold, nounderscore, noitalics]#[fg=#b8a5a5,bg=#523535] %Y-%m-%d  %H:%M #[fg=#e8d5d5,bg=#523535,nobold,noitalics,nounderscore]#[fg=#322e2e,bg=#e8d5d5] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#322e2e,bg=#d19a66,nobold,noitalics,nounderscore]#[fg=#523535,bg=#d19a66] #I #[fg=#523535,bg=#d19a66,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#d19a66,bg=#322e2e,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#322e2e,bg=#523535,noitalics]#[fg=#f4e1e1,bg=#523535] #I #[fg=#f4e1e1,bg=#523535] #W#{?window_zoomed_flag,*Z,}} #[fg=#523535,bg=#322e2e,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
