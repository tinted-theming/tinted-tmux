# Base24 Stranger Theme Hawkins
# Scheme author: Stranger Theme (https://github.com/stranger-theme/stranger-theme)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#b8ac98,bg=#40362c"

# default window title colors
set-window-option -g window-status-style "fg=#b8ac98,bg=#40362c"

# active window title colors
set-window-option -g window-status-current-style "fg=#ffe9a9,bg=#40362c"

# pane border
set-option -g pane-border-style "fg=#40362c"
set-option -g pane-active-border-style "fg=#b8ac98"

# message text
set-option -g message-style "fg=#f4e8d4,bg=#4d4339"

# pane number display
set-option -g display-panes-active-colour "#b8ac98"
set-option -g display-panes-colour "#40362c"

# clock
set-window-option -g clock-mode-colour "#b48ead"

# copy mode highlight
set-window-option -g mode-style "fg=#b8ac98,bg=#4d4339"

# bell
set-window-option -g window-status-bell-style "fg=#2c2218,bg=#bf616a"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#e8dcc8,bg=#40362c"

# style for command messages
set-option -g message-command-style "fg=#f4e8d4,bg=#4d4339"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#e8dcc8,bg=#2c2218"
  set-window-option -g window-style "fg=#e8dcc8,bg=#40362c"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#e8dcc8,bg=#9e8766] #S #[fg=#9e8766,bg=#40362c,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#4d4339,bg=#40362c nobold, nounderscore, noitalics]#[fg=#b8ac98,bg=#4d4339] %Y-%m-%d  %H:%M #[fg=#e8dcc8,bg=#4d4339,nobold,noitalics,nounderscore]#[fg=#40362c,bg=#e8dcc8] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#40362c,bg=#ebcb8b,nobold,noitalics,nounderscore]#[fg=#4d4339,bg=#ebcb8b] #I #[fg=#4d4339,bg=#ebcb8b,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#ebcb8b,bg=#40362c,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#40362c,bg=#4d4339,noitalics]#[fg=#f4e8d4,bg=#4d4339] #I #[fg=#f4e8d4,bg=#4d4339] #W#{?window_zoomed_flag,*Z,}} #[fg=#4d4339,bg=#40362c,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
