# Base24 Stranger Theme Starcourt
# Scheme author: Stranger Theme (https://github.com/stranger-theme/stranger-theme)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#bababa,bg=#2e2e42"

# default window title colors
set-window-option -g window-status-style "fg=#bababa,bg=#2e2e42"

# active window title colors
set-window-option -g window-status-current-style "fg=#fff51e,bg=#2e2e42"

# pane border
set-option -g pane-border-style "fg=#2e2e42"
set-option -g pane-active-border-style "fg=#bababa"

# message text
set-option -g message-style "fg=#f6f6f6,bg=#3d3d66"

# pane number display
set-option -g display-panes-active-colour "#bababa"
set-option -g display-panes-colour "#2e2e42"

# clock
set-window-option -g clock-mode-colour "#ba55d3"

# copy mode highlight
set-window-option -g mode-style "fg=#bababa,bg=#3d3d66"

# bell
set-window-option -g window-status-bell-style "fg=#1a1a2e,bg=#ff6b6b"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#eaeaea,bg=#2e2e42"

# style for command messages
set-option -g message-command-style "fg=#f6f6f6,bg=#3d3d66"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#eaeaea,bg=#1a1a2e"
  set-window-option -g window-style "fg=#eaeaea,bg=#2e2e42"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#eaeaea,bg=#8c77c3] #S #[fg=#8c77c3,bg=#2e2e42,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#3d3d66,bg=#2e2e42 nobold, nounderscore, noitalics]#[fg=#bababa,bg=#3d3d66] %Y-%m-%d  %H:%M #[fg=#eaeaea,bg=#3d3d66,nobold,noitalics,nounderscore]#[fg=#2e2e42,bg=#eaeaea] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#2e2e42,bg=#ffd700,nobold,noitalics,nounderscore]#[fg=#3d3d66,bg=#ffd700] #I #[fg=#3d3d66,bg=#ffd700,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#ffd700,bg=#2e2e42,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#2e2e42,bg=#3d3d66,noitalics]#[fg=#f6f6f6,bg=#3d3d66] #I #[fg=#f6f6f6,bg=#3d3d66] #W#{?window_zoomed_flag,*Z,}} #[fg=#3d3d66,bg=#2e2e42,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
