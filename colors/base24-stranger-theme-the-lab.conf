# Base24 Stranger Theme The Lab
# Scheme author: Stranger Theme (https://github.com/stranger-theme/stranger-theme)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#b0b5bc,bg=#2e313a"

# default window title colors
set-window-option -g window-status-style "fg=#b0b5bc,bg=#2e313a"

# active window title colors
set-window-option -g window-status-current-style "fg=#fffa1e,bg=#2e313a"

# pane border
set-option -g pane-border-style "fg=#2e313a"
set-option -g pane-active-border-style "fg=#b0b5bc"

# message text
set-option -g message-style "fg=#ecf1f8,bg=#3c3f48"

# pane number display
set-option -g display-panes-active-colour "#b0b5bc"
set-option -g display-panes-colour "#2e313a"

# clock
set-window-option -g clock-mode-colour "#b10dc9"

# copy mode highlight
set-window-option -g mode-style "fg=#b0b5bc,bg=#3c3f48"

# bell
set-window-option -g window-status-bell-style "fg=#1a1d26,bg=#ff4136"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#e0e5ec,bg=#2e313a"

# style for command messages
set-option -g message-command-style "fg=#ecf1f8,bg=#3c3f48"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#e0e5ec,bg=#1a1d26"
  set-window-option -g window-style "fg=#e0e5ec,bg=#2e313a"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#e0e5ec,bg=#73879c] #S #[fg=#73879c,bg=#2e313a,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#3c3f48,bg=#2e313a nobold, nounderscore, noitalics]#[fg=#b0b5bc,bg=#3c3f48] %Y-%m-%d  %H:%M #[fg=#e0e5ec,bg=#3c3f48,nobold,noitalics,nounderscore]#[fg=#2e313a,bg=#e0e5ec] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#2e313a,bg=#ffdc00,nobold,noitalics,nounderscore]#[fg=#3c3f48,bg=#ffdc00] #I #[fg=#3c3f48,bg=#ffdc00,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#ffdc00,bg=#2e313a,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#2e313a,bg=#3c3f48,noitalics]#[fg=#ecf1f8,bg=#3c3f48] #I #[fg=#ecf1f8,bg=#3c3f48] #W#{?window_zoomed_flag,*Z,}} #[fg=#3c3f48,bg=#2e313a,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
