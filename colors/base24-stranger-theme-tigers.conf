# Base24 Stranger Theme Tigers
# Scheme author: Stranger Theme (https://github.com/stranger-theme/stranger-theme)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#c5c5c5,bg=#2c322c"

# default window title colors
set-window-option -g window-status-style "fg=#c5c5c5,bg=#2c322c"

# active window title colors
set-window-option -g window-status-current-style "fg=#ffe492,bg=#2c322c"

# pane border
set-option -g pane-border-style "fg=#2c322c"
set-option -g pane-active-border-style "fg=#c5c5c5"

# message text
set-option -g message-style "fg=#ffffff,bg=#38463a"

# pane number display
set-option -g display-panes-active-colour "#c5c5c5"
set-option -g display-panes-colour "#2c322c"

# clock
set-window-option -g clock-mode-colour "#81a2be"

# copy mode highlight
set-window-option -g mode-style "fg=#c5c5c5,bg=#38463a"

# bell
set-window-option -g window-status-bell-style "fg=#181e18,bg=#cc6666"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#f5f5f5,bg=#2c322c"

# style for command messages
set-option -g message-command-style "fg=#ffffff,bg=#38463a"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#f5f5f5,bg=#181e18"
  set-window-option -g window-style "fg=#f5f5f5,bg=#2c322c"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#f5f5f5,bg=#758975] #S #[fg=#758975,bg=#2c322c,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#38463a,bg=#2c322c nobold, nounderscore, noitalics]#[fg=#c5c5c5,bg=#38463a] %Y-%m-%d  %H:%M #[fg=#f5f5f5,bg=#38463a,nobold,noitalics,nounderscore]#[fg=#2c322c,bg=#f5f5f5] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#2c322c,bg=#f0c674,nobold,noitalics,nounderscore]#[fg=#38463a,bg=#f0c674] #I #[fg=#38463a,bg=#f0c674,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#f0c674,bg=#2c322c,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#2c322c,bg=#38463a,noitalics]#[fg=#ffffff,bg=#38463a] #I #[fg=#ffffff,bg=#38463a] #W#{?window_zoomed_flag,*Z,}} #[fg=#38463a,bg=#2c322c,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
