# Base24 Stranger Theme Upside Down
# Scheme author: Stranger Theme (https://github.com/stranger-theme/stranger-theme)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#c8c8c2,bg=#21252b"

# default window title colors
set-window-option -g window-status-style "fg=#c8c8c2,bg=#21252b"

# active window title colors
set-window-option -g window-status-current-style "fg=#ffde99,bg=#21252b"

# pane border
set-option -g pane-border-style "fg=#21252b"
set-option -g pane-active-border-style "fg=#c8c8c2"

# message text
set-option -g message-style "fg=#fffffe,bg=#2a3c4a"

# pane number display
set-option -g display-panes-active-colour "#c8c8c2"
set-option -g display-panes-colour "#21252b"

# clock
set-window-option -g clock-mode-colour "#61afef"

# copy mode highlight
set-window-option -g mode-style "fg=#c8c8c2,bg=#2a3c4a"

# bell
set-window-option -g window-status-bell-style "fg=#0d1117,bg=#e06c75"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#f8f8f2,bg=#21252b"

# style for command messages
set-option -g message-command-style "fg=#fffffe,bg=#2a3c4a"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#f8f8f2,bg=#0d1117"
  set-window-option -g window-style "fg=#f8f8f2,bg=#21252b"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#f8f8f2,bg=#7a8495] #S #[fg=#7a8495,bg=#21252b,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#2a3c4a,bg=#21252b nobold, nounderscore, noitalics]#[fg=#c8c8c2,bg=#2a3c4a] %Y-%m-%d  %H:%M #[fg=#f8f8f2,bg=#2a3c4a,nobold,noitalics,nounderscore]#[fg=#21252b,bg=#f8f8f2] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#21252b,bg=#e5c07b,nobold,noitalics,nounderscore]#[fg=#2a3c4a,bg=#e5c07b] #I #[fg=#2a3c4a,bg=#e5c07b,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#e5c07b,bg=#21252b,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#21252b,bg=#2a3c4a,noitalics]#[fg=#fffffe,bg=#2a3c4a] #I #[fg=#fffffe,bg=#2a3c4a] #W#{?window_zoomed_flag,*Z,}} #[fg=#2a3c4a,bg=#21252b,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
